version: "3.8"

services:
  redis:
    image: redis:alpine
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: always

  backend:
    image: sunnev/openregex-backend:latest
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379
      - MAX_AI_QUEUE=${MAX_AI_QUEUE:-10}
      - RATE_LIMIT_REQUESTS=${RATE_LIMIT_REQUESTS:-60}
      - RATE_LIMIT_WINDOW=${RATE_LIMIT_WINDOW:-60}
      - API_AI_ENDPOINT_ENABLE=${API_AI_ENDPOINT_ENABLE:-false}
      - API_REGEX_ENDPOINT_ENABLE=${API_REGEX_ENDPOINT_ENABLE:-true}
    depends_on:
      redis:
        condition: service_healthy
    restart: always

  frontend:
    image: sunnev/openregex-frontend:latest
    ports:
      - "5000:5000"
    environment:
      - ROBOTS_META=${ROBOTS_META:-noindex, nofollow}
      - VITE_APP_TERMS={VITE_APP_TERMS:-} # accepted for local
    restart: always
    depends_on:
      - backend

  # --- OPTIONAL AI WORKER ---
  # Uncomment the lines below to enable LLM-powered regex assistance.
  # 🛡️ SECURITY RECOMMENDATION: For production, we strongly advise pointing LLM_ENDPOINT
  # to a proxy server (like LiteLLM) to safely manage and isolate your API keys.
  # worker-ai:
  #   image: sunnev/openregex-worker-ai:latest
  #   environment:
  #     - REDIS_URL=redis://redis:6379
  #     - LLM_ENDPOINT=${LLM_ENDPOINT:-}
  #     - LLM_MODEL=${LLM_MODEL:-}
  #     - LLM_API_KEY=${LLM_API_KEY:-}
  #     - LLM_SSL_VERIFY=${LLM_SSL_VERIFY:-true}
  #   depends_on:
  #     redis:
  #       condition: service_healthy
  #   restart: always

  worker-python:
    image: sunnev/openregex-worker-python:latest
    environment:
      - REDIS_URL=redis://redis:6379
      - WORKER_EXECUTION_TIMEOUT_MS=${WORKER_EXECUTION_TIMEOUT_MS:-1000}
      - WORKER_MAX_INPUT_SIZE=${WORKER_MAX_INPUT_SIZE:-10485760}
      - WORKER_MAX_MATCHES=${WORKER_MAX_MATCHES:-10000}
      - WORKER_MAX_GROUPS=${WORKER_MAX_GROUPS:-1000}
      - WORKER_MAX_JSON_SIZE=${WORKER_MAX_JSON_SIZE:-10485760}
    depends_on:
      redis:
        condition: service_healthy
    restart: always

  worker-c-cpp:
    image: sunnev/openregex-worker-c-cpp:latest
    environment:
      - REDIS_URL=redis://redis:6379
      - WORKER_EXECUTION_TIMEOUT_MS=${WORKER_EXECUTION_TIMEOUT_MS:-1000}
      - WORKER_MAX_INPUT_SIZE=${WORKER_MAX_INPUT_SIZE:-10485760}
      - WORKER_MAX_MATCHES=${WORKER_MAX_MATCHES:-10000}
      - WORKER_MAX_GROUPS=${WORKER_MAX_GROUPS:-1000}
      - WORKER_MAX_JSON_SIZE=${WORKER_MAX_JSON_SIZE:-10485760}
    depends_on:
      redis:
        condition: service_healthy
    restart: always

  worker-v8:
    image: sunnev/openregex-worker-v8:latest
    environment:
      - REDIS_URL=redis://redis:6379
      - WORKER_EXECUTION_TIMEOUT_MS=${WORKER_EXECUTION_TIMEOUT_MS:-1000}
      - WORKER_MAX_INPUT_SIZE=${WORKER_MAX_INPUT_SIZE:-10485760}
      - WORKER_MAX_MATCHES=${WORKER_MAX_MATCHES:-10000}
      - WORKER_MAX_GROUPS=${WORKER_MAX_GROUPS:-1000}
      - WORKER_MAX_JSON_SIZE=${WORKER_MAX_JSON_SIZE:-10485760}
    depends_on:
      redis:
        condition: service_healthy
    restart: always

  worker-jvm:
    image: sunnev/openregex-worker-jvm:latest
    environment:
      - REDIS_URL=redis://redis:6379
      - WORKER_EXECUTION_TIMEOUT_MS=${WORKER_EXECUTION_TIMEOUT_MS:-1000}
      - WORKER_MAX_INPUT_SIZE=${WORKER_MAX_INPUT_SIZE:-10485760}
      - WORKER_MAX_MATCHES=${WORKER_MAX_MATCHES:-10000}
      - WORKER_MAX_GROUPS=${WORKER_MAX_GROUPS:-1000}
      - WORKER_MAX_JSON_SIZE=${WORKER_MAX_JSON_SIZE:-10485760}
    depends_on:
      redis:
        condition: service_healthy
    restart: always

  worker-rust:
    image: sunnev/openregex-worker-rust:latest
    environment:
      - REDIS_URL=redis://redis:6379
      - WORKER_EXECUTION_TIMEOUT_MS=${WORKER_EXECUTION_TIMEOUT_MS:-1000}
      - WORKER_MAX_INPUT_SIZE=${WORKER_MAX_INPUT_SIZE:-10485760}
      - WORKER_MAX_MATCHES=${WORKER_MAX_MATCHES:-10000}
      - WORKER_MAX_GROUPS=${WORKER_MAX_GROUPS:-1000}
      - WORKER_MAX_JSON_SIZE=${WORKER_MAX_JSON_SIZE:-10485760}
    depends_on:
      redis:
        condition: service_healthy
    restart: always

  worker-dotnet:
    image: sunnev/openregex-worker-dotnet:latest
    environment:
      - REDIS_URL=redis://redis:6379
      - WORKER_EXECUTION_TIMEOUT_MS=${WORKER_EXECUTION_TIMEOUT_MS:-1000}
      - WORKER_MAX_INPUT_SIZE=${WORKER_MAX_INPUT_SIZE:-10485760}
      - WORKER_MAX_MATCHES=${WORKER_MAX_MATCHES:-10000}
      - WORKER_MAX_GROUPS=${WORKER_MAX_GROUPS:-1000}
      - WORKER_MAX_JSON_SIZE=${WORKER_MAX_JSON_SIZE:-10485760}
    depends_on:
      redis:
        condition: service_healthy
    restart: always

  worker-php:
    image: sunnev/openregex-worker-php:latest
    environment:
      - REDIS_URL=redis://redis:6379
      - WORKER_EXECUTION_TIMEOUT_MS=${WORKER_EXECUTION_TIMEOUT_MS:-1000}
      - WORKER_MAX_INPUT_SIZE=${WORKER_MAX_INPUT_SIZE:-10485760}
      - WORKER_MAX_MATCHES=${WORKER_MAX_MATCHES:-10000}
      - WORKER_MAX_GROUPS=${WORKER_MAX_GROUPS:-1000}
      - WORKER_MAX_JSON_SIZE=${WORKER_MAX_JSON_SIZE:-10485760}
    depends_on:
      redis:
        condition: service_healthy
    restart: always

  # --- DATABASE ENGINES ---
  # PostgreSQL and MySQL cannot be embedded in a worker: their regex engines
  # only exist behind a server, so the workers query a real instance. Both are
  # stateless here - no volumes, nothing to persist.
  postgres:
    image: postgres:17-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-openregex}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-openregex}
      - POSTGRES_DB=${POSTGRES_DB:-openregex}
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-openregex}" ]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: always

  mysql:
    image: mysql:8.4
    command: --regexp-time-limit=200000
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-openregex-root}
      - MYSQL_USER=${MYSQL_USER:-openregex}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-openregex}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-openregex}
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "127.0.0.1" ]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: always

  worker-ruby:
    image: sunnev/openregex-worker-ruby:latest
    environment:
      - REDIS_URL=redis://redis:6379
      - WORKER_EXECUTION_TIMEOUT_MS=${WORKER_EXECUTION_TIMEOUT_MS:-1000}
      - WORKER_MAX_INPUT_SIZE=${WORKER_MAX_INPUT_SIZE:-10485760}
      - WORKER_MAX_MATCHES=${WORKER_MAX_MATCHES:-10000}
      - WORKER_MAX_GROUPS=${WORKER_MAX_GROUPS:-1000}
      - WORKER_MAX_JSON_SIZE=${WORKER_MAX_JSON_SIZE:-10485760}
    depends_on:
      redis:
        condition: service_healthy
    restart: always

  worker-perl:
    image: sunnev/openregex-worker-perl:latest
    environment:
      - REDIS_URL=redis://redis:6379
      - WORKER_EXECUTION_TIMEOUT_MS=${WORKER_EXECUTION_TIMEOUT_MS:-1000}
      - WORKER_MAX_INPUT_SIZE=${WORKER_MAX_INPUT_SIZE:-10485760}
      - WORKER_MAX_MATCHES=${WORKER_MAX_MATCHES:-10000}
      - WORKER_MAX_GROUPS=${WORKER_MAX_GROUPS:-1000}
      - WORKER_MAX_JSON_SIZE=${WORKER_MAX_JSON_SIZE:-10485760}
    depends_on:
      redis:
        condition: service_healthy
    restart: always

  worker-jvm8:
    image: sunnev/openregex-worker-jvm8:latest
    environment:
      - REDIS_URL=redis://redis:6379
      - WORKER_EXECUTION_TIMEOUT_MS=${WORKER_EXECUTION_TIMEOUT_MS:-1000}
      - WORKER_MAX_INPUT_SIZE=${WORKER_MAX_INPUT_SIZE:-10485760}
      - WORKER_MAX_MATCHES=${WORKER_MAX_MATCHES:-10000}
      - WORKER_MAX_GROUPS=${WORKER_MAX_GROUPS:-1000}
      - WORKER_MAX_JSON_SIZE=${WORKER_MAX_JSON_SIZE:-10485760}
    depends_on:
      redis:
        condition: service_healthy
    restart: always

  worker-posix:
    image: sunnev/openregex-worker-posix:latest
    environment:
      - REDIS_URL=redis://redis:6379
      - WORKER_EXECUTION_TIMEOUT_MS=${WORKER_EXECUTION_TIMEOUT_MS:-1000}
      - WORKER_MAX_INPUT_SIZE=${WORKER_MAX_INPUT_SIZE:-10485760}
      - WORKER_MAX_MATCHES=${WORKER_MAX_MATCHES:-10000}
      - WORKER_MAX_GROUPS=${WORKER_MAX_GROUPS:-1000}
      - WORKER_MAX_JSON_SIZE=${WORKER_MAX_JSON_SIZE:-10485760}
    depends_on:
      redis:
        condition: service_healthy
    restart: always

  worker-vim:
    image: sunnev/openregex-worker-vim:latest
    environment:
      - REDIS_URL=redis://redis:6379
      - WORKER_EXECUTION_TIMEOUT_MS=${WORKER_EXECUTION_TIMEOUT_MS:-1000}
      - WORKER_MAX_INPUT_SIZE=${WORKER_MAX_INPUT_SIZE:-10485760}
      - WORKER_MAX_MATCHES=${WORKER_MAX_MATCHES:-10000}
      - WORKER_MAX_GROUPS=${WORKER_MAX_GROUPS:-1000}
      - WORKER_MAX_JSON_SIZE=${WORKER_MAX_JSON_SIZE:-10485760}
    depends_on:
      redis:
        condition: service_healthy
    restart: always

  worker-postgres:
    image: sunnev/openregex-worker-postgres:latest
    environment:
      - REDIS_URL=redis://redis:6379
      - WORKER_EXECUTION_TIMEOUT_MS=${WORKER_EXECUTION_TIMEOUT_MS:-1000}
      - WORKER_MAX_INPUT_SIZE=${WORKER_MAX_INPUT_SIZE:-10485760}
      - WORKER_MAX_MATCHES=${WORKER_MAX_MATCHES:-10000}
      - WORKER_MAX_GROUPS=${WORKER_MAX_GROUPS:-1000}
      - WORKER_MAX_JSON_SIZE=${WORKER_MAX_JSON_SIZE:-10485760}
      - POSTGRES_DSN=postgresql://${POSTGRES_USER:-openregex}:${POSTGRES_PASSWORD:-openregex}@postgres:5432/${POSTGRES_DB:-openregex}
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: always

  worker-mysql:
    image: sunnev/openregex-worker-mysql:latest
    environment:
      - REDIS_URL=redis://redis:6379
      - WORKER_EXECUTION_TIMEOUT_MS=${WORKER_EXECUTION_TIMEOUT_MS:-1000}
      - WORKER_MAX_INPUT_SIZE=${WORKER_MAX_INPUT_SIZE:-10485760}
      - WORKER_MAX_MATCHES=${WORKER_MAX_MATCHES:-10000}
      - WORKER_MAX_GROUPS=${WORKER_MAX_GROUPS:-1000}
      - WORKER_MAX_JSON_SIZE=${WORKER_MAX_JSON_SIZE:-10485760}
      - MYSQL_HOST=mysql
      - MYSQL_USER=${MYSQL_USER:-openregex}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-openregex}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-openregex}
    depends_on:
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy
    restart: always
