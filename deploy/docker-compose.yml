# PRODUCTION ARCHITECTURE
# Fully immutable containers, no source mounts, restarting policies enabled.

services:
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    restart: always

  backend:
    build:
      context: ..
      dockerfile: deploy/dockerfiles/openregex-backend.dockerfile
      target: production
    ports:
      - "8000:8000"
    depends_on:
      - redis
    restart: always

  frontend:
    build:
      context: ..
      dockerfile: deploy/dockerfiles/openregex-frontend.dockerfile
      target: production
      args:
        - VITE_APP_TERMS=${APP_TERMS:-}
    ports:
      - "5000:5000"
    restart: always

  worker-ai:
    build:
      context: ..
      dockerfile: deploy/dockerfiles/worker-ai.dockerfile
      target: production
    depends_on:
      - redis
    restart: always
    environment:
      - LLM_ENDPOINT=${LLM_ENDPOINT:-}
      - LLM_MODEL=${LLM_MODEL:-}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_SSL_VERIFY=${LLM_SSL_VERIFY:-true}

  worker-python:
    build:
      context: ..
      dockerfile: deploy/dockerfiles/worker-python.dockerfile
      target: production
    depends_on:
      - redis
    restart: always

  worker-c-cpp:
    build:
      context: ..
      dockerfile: deploy/dockerfiles/worker-c-cpp.dockerfile
      target: production
    depends_on:
      - redis
    restart: always

  worker-v8:
    build:
      context: ..
      dockerfile: deploy/dockerfiles/worker-v8.dockerfile
      target: production
    depends_on:
      - redis
    restart: always

  worker-jvm:
    build:
      context: ..
      dockerfile: deploy/dockerfiles/worker-jvm.dockerfile
      target: production
    depends_on:
      - redis
    restart: always

  worker-dotnet:
    build:
      context: ..
      dockerfile: deploy/dockerfiles/worker-dotnet.dockerfile
      target: production
    depends_on:
      - redis
    restart: always

  worker-rust:
    build:
      context: ..
      dockerfile: deploy/dockerfiles/worker-rust.dockerfile
      target: production
    depends_on:
      - redis
    restart: always

  worker-go:
    build:
      context: ..
      dockerfile: deploy/dockerfiles/worker-go.dockerfile
      target: production
    depends_on:
      - redis
    restart: always

  worker-php:
    build:
      context: ..
      dockerfile: deploy/dockerfiles/worker-php.dockerfile
      target: production
    depends_on:
      - redis
    restart: always

  # --- DATABASE ENGINES ---
  # PostgreSQL and MySQL cannot be embedded in a worker: their regex engines
  # only exist behind a server, so the workers query a real instance. Both are
  # stateless here - no volumes, nothing to persist.
  postgres:
    image: postgres:17-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-openregex}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-openregex}
      - POSTGRES_DB=${POSTGRES_DB:-openregex}
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-openregex}" ]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: always

  mysql:
    image: mysql:8.4
    command: --regexp-time-limit=200000
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-openregex-root}
      - MYSQL_USER=${MYSQL_USER:-openregex}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-openregex}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-openregex}
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "127.0.0.1" ]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: always

  worker-ruby:
    build:
      context: ..
      dockerfile: deploy/dockerfiles/worker-ruby.dockerfile
      target: production
    depends_on:
      - redis
    restart: always

  worker-perl:
    build:
      context: ..
      dockerfile: deploy/dockerfiles/worker-perl.dockerfile
      target: production
    depends_on:
      - redis
    restart: always

  worker-jvm8:
    build:
      context: ..
      dockerfile: deploy/dockerfiles/worker-jvm8.dockerfile
      target: production
    depends_on:
      - redis
    restart: always

  worker-posix:
    build:
      context: ..
      dockerfile: deploy/dockerfiles/worker-posix.dockerfile
      target: production
    depends_on:
      - redis
    restart: always

  worker-vim:
    build:
      context: ..
      dockerfile: deploy/dockerfiles/worker-vim.dockerfile
      target: production
    depends_on:
      - redis
    restart: always

  worker-postgres:
    build:
      context: ..
      dockerfile: deploy/dockerfiles/worker-postgres.dockerfile
      target: production
    environment:
      - POSTGRES_DSN=postgresql://${POSTGRES_USER:-openregex}:${POSTGRES_PASSWORD:-openregex}@postgres:5432/${POSTGRES_DB:-openregex}
    depends_on:
      - redis
      - postgres
    restart: always

  worker-mysql:
    build:
      context: ..
      dockerfile: deploy/dockerfiles/worker-mysql.dockerfile
      target: production
    environment:
      - MYSQL_HOST=mysql
      - MYSQL_USER=${MYSQL_USER:-openregex}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-openregex}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-openregex}
    depends_on:
      - redis
      - mysql
    restart: always
