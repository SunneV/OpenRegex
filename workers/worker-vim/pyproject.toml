[project]
name = "openregex-worker-vim"
version = "1.0.0"
description = "OpenRegex Vim pattern engine worker."
authors = [
    { name = "SunneV (Wojciech Cichoń)" }
]
license = { text = "Apache-2.0" }
dependencies = [
    "redis",
    "openregex-libs",
]

[tool.uv.sources]
openregex-libs = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/worker_vim"]
