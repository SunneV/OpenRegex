[package]
name = "openregex-worker-rust"
version = "1.0.0"
edition = "2021"

[dependencies]
redis = { version = "0.24", features = ["tokio-comp"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.10"
fancy-regex = "0.14"
tokio = { version = "1.35", features = ["full"] }