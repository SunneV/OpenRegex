[project]
name = "openregex-worker-python"
version = "1.1.0"
description = "OpenRegex Python regex evaluation worker."
authors = [
    { name = "SunneV (Wojciech Cichoń)" }
]
license = { text = "Apache-2.0" }
dependencies = [
    "redis",
    "regex",
    "openregex-libs",
]

[tool.uv.sources]
openregex-libs = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/worker_python"]