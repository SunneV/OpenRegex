[project]
name = "openregex-worker-ai"
version = "1.3.0"
description = "OpenRegex AI assistant worker for pattern generation, explanation, and optimization."
authors = [
    { name = "SunneV (Wojciech Cichoń)" }
]
license = { text = "Apache-2.0" }
dependencies = [
    "redis",
    "requests",
    "openregex-libs",
]

[tool.uv.sources]
openregex-libs = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/worker_ai"]