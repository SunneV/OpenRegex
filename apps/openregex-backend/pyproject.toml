[project]
name = "openregex-backend"
version = "2.2.0"
description = "OpenRegex API backend service orchestrating Redis queues and workers."
authors = [
    { name = "SunneV (Wojciech Cichoń)" }
]
license = { text = "Apache-2.0" }
dependencies = [
    "fastapi",
    "uvicorn",
    "redis",
    "openregex-libs",
]

[tool.uv.sources]
openregex-libs = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/backend"]